<!DOCTYPE html>
<html lang="en">
<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  
  <script>
    const handleResponse = (response, method) => {
      const content = document.getElementById('content');
      content.innerHTML = '';
 
      const statusParagraph = document.createElement('p');
      statusParagraph.textContent = `Status Code: ${response.status}`;
      content.appendChild(statusParagraph);
 
      // HEAD requests have no body to parse
      if (method === 'HEAD') {
        return Promise.resolve();
      }
 
      return response.json().then((data) => {
        const pre = document.createElement('pre');
        pre.textContent = JSON.stringify(data);
        content.appendChild(pre);
      });
    };
 
    const sendGetOrHead = (e) => {
      e.preventDefault();
 
      const selectedUrl = document.getElementById('urlField').value;
      const method = document.getElementById('methodSelect').value.toUpperCase();
 
      fetch(selectedUrl, { method })
        .then((response) => handleResponse(response, method))
        .catch((err) => console.error(err));
    };
 
    const sendAddUser = (e) => {
      e.preventDefault();
 
      const name = document.getElementById('nameField').value;
      const age = document.getElementById('ageField').value;
 
      fetch('/addUser', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, age }),
      })
        .then((response) => handleResponse(response, 'POST'))
        .catch((err) => console.error(err));
    };
 
    const init = () => {
      document.getElementById('userForm').addEventListener('submit', sendGetOrHead);
      document.getElementById('nameForm').addEventListener('submit', sendAddUser);
    };
 
    window.onload = init;
  </script>
</head>
<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1"/>
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>
</html>
